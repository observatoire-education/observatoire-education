# Collecte nocturne, génération du site et déploiement sur Cloudflare Workers (assets statiques).
# - La nuit : collecte des sources (archivées en GitHub Releases), commit du journal (une ligne par
#   source et par nuit : le dépôt reste actif, la tâche planifiée n'est jamais suspendue).
# - Si aucune source n'a changé la nuit, le site n'est pas reconstruit.
# - Sur un push : pas de collecte, reconstruction et déploiement avec les archives existantes.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  collecter-construire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      construit: ${{ steps.change.outputs.reconstruire }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - run: bun install --frozen-lockfile

      - name: Identité du bot pour les commits de données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - name: Collecte des sources
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh : publier les archives en Releases
        run: bun run collect

      - name: Une source a-t-elle changé ?
        id: change
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ ! -f archives/manifest.json ]; then
            echo "Aucune archive : lancer d'abord le workflow à la main (workflow_dispatch) pour une première collecte."
            echo "reconstruire=false" >> "$GITHUB_OUTPUT"
          # git status (et non git diff) : un manifest tout juste créé, encore non suivi, compte comme un changement
          elif [ "$EVENEMENT" = "schedule" ] && [ -z "$(git status --porcelain -- archives/manifest.json)" ]; then
            echo "reconstruire=false" >> "$GITHUB_OUTPUT"
          else
            echo "reconstruire=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit du journal (aucune source modifiée)
        if: github.event_name != 'push' && steps.change.outputs.reconstruire == 'false'
        run: |
          git add archives/
          git diff --cached --quiet || git commit -m "data: collecte du $(date -u +%F)"
          git pull --rebase --autostash && git push

      - name: Cache des archives
        if: steps.change.outputs.reconstruire == 'true'
        uses: actions/cache@v6
        with:
          path: .cache/archives
          key: archives-${{ hashFiles('archives/manifest.json') }}
          restore-keys: archives-

      - name: Données, site et garde-fous
        if: steps.change.outputs.reconstruire == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh : récupérer les archives absentes du cache
        run: bun run build

      - name: Commit des archives (manifest, journal, registre des pages)
        if: steps.change.outputs.reconstruire == 'true'
        run: |
          git add archives/
          if ! git diff --cached --quiet; then
            git commit -m "data: collecte du $(date -u +%F)"
            git pull --rebase --autostash && git push
          fi

      - uses: actions/upload-artifact@v4
        if: steps.change.outputs.reconstruire == 'true'
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1

  deployer:
    needs: collecter-construire
    if: needs.collecter-construire.outputs.construit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # envoi de dizaines de milliers de fichiers statiques
    steps:
      - uses: actions/checkout@v7 # wrangler.jsonc
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      # bunx et non wrangler-action : l'action installe wrangler avec npm dans le dépôt, qui échoue sur les
      # dépendances workspace:* (et bun n'y est pas). Aucune installation des dépendances du dépôt : wrangler lit
      # wrangler.jsonc et sert ./dist (assets seuls, rien à compiler). Version exacte, publiée depuis plus de deux semaines.
      - name: Déploiement sur Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.159.0 deploy
