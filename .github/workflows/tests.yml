# Tests à chaque push et pull request : pipeline, SQL, HTML généré (site d'essai construit sur les fixtures).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --coverage
